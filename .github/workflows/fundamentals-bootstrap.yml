name: Fundamental Health Bootstrap

on:
  push:
    paths:
      - "engine/fundamentals_engine.py"
      - "engine/fundamentals_requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamentals-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/fundamentals_requirements.txt
      - name: Generate snapshot
        run: python engine/fundamentals_engine.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Create fundamental health snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
          done
          exit 1
