name: Update NSE stock directory

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"  # 8:00 AM IST

permissions:
  contents: write

concurrency:
  group: nse-universe
  cancel-in-progress: true

jobs:
  nse-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NSE equity directory
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          url = "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv"
          req = urllib.request.Request(url, headers={
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept":"text/csv,*/*",
              "Referer":"https://www.nseindia.com/"
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode("utf-8-sig", errors="replace")

          rows=[]
          for row in csv.DictReader(io.StringIO(raw)):
              clean={str(k or "").strip().upper():str(v or "").strip() for k,v in row.items()}
              symbol=clean.get("SYMBOL","").upper()
              company=clean.get("NAME OF COMPANY","")
              series=clean.get("SERIES","").upper()
              isin=clean.get("ISIN NUMBER","").upper()
              if symbol and company and series in ("EQ","BE","BZ","SM"):
                  rows.append({"symbol":symbol,"companyName":company,"series":series,"isin":isin})

          rows=sorted({x["symbol"]:x for x in rows}.values(), key=lambda x:x["symbol"])
          if len(rows) < 1000:
              raise SystemExit(f"Unexpected NSE directory size: {len(rows)}")

          out=Path("data/nse_universe.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
              "source":"NSE India — Securities available for Equity segment",
              "sourceUrl":"https://www.nseindia.com/static/market-data/securities-available-for-trading",
              "generatedAt":datetime.now(timezone.utc).isoformat(),
              "count":len(rows),
              "stocks":rows
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"Published NSE search directory: {len(rows)} stocks")
          PY

      - name: Ensure NSE-wide search script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./nse-search.js?v=1"></script>'
          if tag not in s:
              if "</body>" not in s:
                  raise SystemExit("index.html has no </body> tag")
              s=s.replace("</body>",tag+"\n</body>",1)
              p.write_text(s,encoding="utf-8")
              print("Injected NSE-wide search script")
          else:
              print("NSE-wide search script already loaded")
          PY

      - name: Commit NSE directory and search integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse_universe.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update NSE-wide stock search directory"
          git push
