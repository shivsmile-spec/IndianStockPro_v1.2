name: Wire Fundamentals UI

on:
  push:
    paths:
      - "fundamentals-ui.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add fundamentals script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./fundamentals-ui.js?v=1"></script>'
          if tag not in s:
              marker='<script src="./external-intelligence.js?v=1"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              else:
                  s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire fundamentals health dashboard"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
