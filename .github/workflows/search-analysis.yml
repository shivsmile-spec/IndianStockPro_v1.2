name: Refresh search stock analysis

on:
  push:
    branches: [ main ]
    paths:
      - 'engine/quant_engine.py'
      - 'engine/search_analysis.py'
      - 'data/nse_universe.json'
      - 'data/news_context.json'
      - '.github/workflows/search-analysis.yml'
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-analysis
  cancel-in-progress: true

jobs:
  build-search-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Build search analysis dataset
        run: |
          python engine/search_analysis.py

      - name: Commit updated analysis dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_analysis.json
          git diff --cached --quiet || git commit -m "Update searchable stock analysis"
          git push
