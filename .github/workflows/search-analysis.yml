name: Refresh search stock analysis

on:
  push:
    branches: [ main ]
    paths:
      - 'engine/quant_engine.py'
      - 'data/nse_universe.json'
      - 'data/news_context.json'
      - '.github/workflows/search-analysis.yml'
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-analysis
  cancel-in-progress: true

jobs:
  build-search-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

