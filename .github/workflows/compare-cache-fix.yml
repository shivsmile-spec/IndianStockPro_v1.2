name: Trial Compare cache fix
on:
  push:
    branches: [trial-tab-ui]
    paths: [compare-ui.js, .github/workflows/compare-cache-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial-tab-ui
          fetch-depth: 0
      - name: Bump Compare cache key
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('compare-ui.js?v=20260821-bridge2','compare-ui.js?v=20260821-standalone3')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Trial: load standalone Compare UI' || exit 0
          git rm .github/workflows/compare-cache-fix.yml
          git commit -m 'Trial: remove one-time Compare cache workflow'
          git push origin HEAD:trial-tab-ui
