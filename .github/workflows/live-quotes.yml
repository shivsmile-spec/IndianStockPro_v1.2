name: Update live market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest NSE-linked quotes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          rankings = json.loads(Path("data/rankings.json").read_text())
          stocks = rankings.get("rankings") or rankings.get("stocks") or []
          if not stocks and isinstance(rankings.get("bands"), list):
              for band in rankings["bands"]:
                  stocks.extend(band.get("stocks") or [])

          symbols = []
          for s in stocks:
              sym = str(s.get("symbol") or "").strip().upper()
              if sym and sym not in symbols:
                  symbols.append(sym)

          generated = datetime.now(timezone.utc).isoformat()
          quotes, errors = {}, {}
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-IN,en;q=0.9",
          }

          def yahoo_quote(sym):
              last = "unknown Yahoo error"
              for host in ("query2.finance.yahoo.com", "query1.finance.yahoo.com"):
                  try:
                      ticker = urllib.parse.quote(sym + ".NS", safe="")
                      url = f"https://{host}/v8/finance/chart/{ticker}?range=1d&interval=1d&includePrePost=false"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          body = json.loads(resp.read().decode("utf-8"))
                      result = (body.get("chart", {}).get("result") or [None])[0]
                      if not result: raise ValueError("empty chart result")
                      meta = result.get("meta", {}) or {}
                      price = meta.get("regularMarketPrice")
                      prev = meta.get("previousClose") or meta.get("chartPreviousClose")
                      if price is None:
                          closes = (((result.get("indicators") or {}).get("quote") or [{}])[0]).get("close") or []
                          vals = [float(x) for x in closes if x is not None]
                          price = vals[-1] if vals else None
                      if price is None: raise ValueError("price missing")
                      price = float(price); prev = float(prev) if prev is not None else None
                      ts = meta.get("regularMarketTime")
                      return {"price":price,"previousClose":prev,"change":(price-prev) if prev is not None else None,"changePct":((price-prev)/prev*100) if prev else None,"timestamp":datetime.fromtimestamp(ts,timezone.utc).isoformat() if ts else generated,"marketState":meta.get("marketState",""),"source":"Yahoo Finance chart endpoint"}
                  except Exception as exc:
                      last = f"{host}: {type(exc).__name__}: {exc}"
              raise RuntimeError(last)

          def nse_quote(sym):
              base="https://www.nseindia.com"; opener=urllib.request.build_opener()
              home=urllib.request.Request(base+"/",headers={**headers,"Referer":base+"/"})
              with opener.open(home,timeout=15) as r: r.read(100)
              url=base+"/api/quote-equity?symbol="+urllib.parse.quote(sym)
              req=urllib.request.Request(url,headers={**headers,"Referer":base+"/get-quotes/equity?symbol="+urllib.parse.quote(sym)})
              with opener.open(req,timeout=15) as resp: body=json.loads(resp.read().decode("utf-8"))
              info=body.get("priceInfo") or {}; price=info.get("lastPrice")
              if price is None: raise ValueError("NSE lastPrice missing")
              price=float(price); prev=info.get("previousClose"); prev=float(prev) if prev is not None else None
              change=info.get("change"); change=float(change) if change is not None else ((price-prev) if prev is not None else None)
              pct=info.get("pChange"); pct=float(pct) if pct is not None else ((change/prev*100) if prev else None)
              return {"price":price,"previousClose":prev,"change":change,"changePct":pct,"timestamp":body.get("metadata",{}).get("lastUpdateTime") or generated,"marketState":"NSE","source":"NSE India public quote endpoint"}

          for sym in symbols:
              try:
                  quotes[sym]=yahoo_quote(sym)
              except Exception as yerr:
                  errors[sym]=[str(yerr)]
                  try: quotes[sym]=nse_quote(sym)
                  except Exception as nerr:
                      errors[sym].append(str(nerr)); print(f"{sym}: unavailable | Yahoo={yerr} | NSE={nerr}")
              time.sleep(0.2)

          out={"generatedAt":generated,"source":"Yahoo Finance with NSE India fallback","quoteCount":len(quotes),"requestedCount":len(symbols),"quotes":quotes,"errors":errors}
          path=Path("data/live_quotes.json"); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(out,indent=2)+"\n")
          print(f"Published {len(quotes)}/{len(symbols)} quotes")
          if errors: print(f"Unavailable symbols: {len(errors)}")
          PY

      - name: Improve live price cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css_anchor = '.live-price-unavailable{font-size:14px;color:#667085;font-weight:700}'
          css_add = '''
          .live-price-wrap{text-align:right;min-width:180px}.live-price-row{display:flex;align-items:center;justify-content:flex-end;gap:7px}.live-live-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:999px;background:#eaf7ee;color:#16743b;font-size:9px;font-weight:900;letter-spacing:.3px}.live-live-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:#2ecc71}.live-change{font-size:11px;font-weight:800;margin-top:3px}.live-change.up{color:#16743b}.live-change.down{color:#b42318}.live-change.flat{color:#667085}.live-meta{font-size:9px;color:#667085;margin-top:4px;line-height:1.25;max-width:240px;margin-left:auto}.live-source{font-weight:700}.live-updated{margin-left:4px}.live-price-wrap .live-price{font-size:20px;font-weight:800}
          @media(max-width:700px){.live-price-wrap{min-width:0}.live-meta{max-width:170px}}
          '''
          if '.live-price-wrap{' not in text:
              text = text.replace(css_anchor, css_anchor + css_add)

          old = '''function livePriceHTML(s){
            const p=livePriceValue(s);
            if(p===null)return `<div class="live-price-unavailable">—</div>`;
            return `<div class="live-price">₹${p.toFixed(2)}</div>`;
          }'''

          new = '''function livePriceHTML(s){
            const p=livePriceValue(s), q=s?.liveQuote;
            if(p===null)return `<div class="live-price-wrap"><div class="live-price-unavailable">—</div><div class="live-meta">Live price unavailable · analysis price hidden</div></div>`;
            const pct=Number(q?.changePct);
            const change=Number(q?.change);
            const cls=Number.isFinite(pct)?(pct>0?"up":pct<0?"down":"flat"):"flat";
            const changeText=Number.isFinite(pct)?`${pct>0?"+":""}${pct.toFixed(2)}%${Number.isFinite(change)?` (${change>0?"+":""}₹${change.toFixed(2)})`:""}`:"Change unavailable";
            const when=q?.timestamp?quoteShortTime(new Date(q.timestamp)):"Update time unavailable";
            const source=q?.source||"Published market feed";
            return `<div class="live-price-wrap"><div class="live-price-row"><span class="live-live-badge">LIVE</span><span class="live-price">₹${p.toFixed(2)}</span></div><div class="live-change ${cls}">${esc(changeText)}</div><div class="live-meta"><span class="live-source">${esc(source)}</span><span class="live-updated">· Updated ${esc(when)}</span></div></div>`;
          }'''

          if old in text:
              text = text.replace(old, new)
          else:
              print("livePriceHTML pattern not found; leaving function unchanged")

          marker = '''function quoteDisplayTime(d){
            try{return new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"medium",timeZone:"Asia/Kolkata"}).format(d)+" IST"}
            catch(e){return d.toLocaleString()+" IST"}
          }'''
          addition = marker + '''

function quoteShortTime(d){
  try{return new Intl.DateTimeFormat("en-IN",{dateStyle:"short",timeStyle:"short",timeZone:"Asia/Kolkata"}).format(d)+" IST"}
  catch(e){return d.toLocaleString()+" IST"}
}'''
          if 'function quoteShortTime(' not in text and marker in text:
              text = text.replace(marker, addition)

          path.write_text(text, encoding="utf-8")
          print("Live price card presentation updated")
          PY

      - name: Commit updated quote feed and UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve live price presentation"
          git push
