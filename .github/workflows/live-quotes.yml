name: Update live market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest NSE-linked quotes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          rankings = json.loads(Path("data/rankings.json").read_text())
          stocks = rankings.get("rankings") or rankings.get("stocks") or []
          if not stocks and isinstance(rankings.get("bands"), list):
              for band in rankings["bands"]:
                  stocks.extend(band.get("stocks") or [])

          symbols = []
          for s in stocks:
              sym = str(s.get("symbol") or "").strip().upper()
              if sym and sym not in symbols:
                  symbols.append(sym)

          quotes = {}
          generated = datetime.now(timezone.utc).isoformat()
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; IndianStockPro/1.9; +https://github.com/shivsmile-spec/IndianStockPro_v1.2)"
          }

          for sym in symbols:
              try:
                  ticker = urllib.parse.quote(sym + ".NS", safe="")
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=1d&interval=5m&includePrePost=false"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                  meta = (body.get("chart", {}).get("result") or [])[0].get("meta", {})
                  price = meta.get("regularMarketPrice")
                  if price is None:
                      raise ValueError("regularMarketPrice missing")
                  prev = meta.get("previousClose") or meta.get("chartPreviousClose")
                  prev = float(prev) if prev is not None else None
                  price = float(price)
                  ts = meta.get("regularMarketTime")
                  timestamp = datetime.fromtimestamp(ts, timezone.utc).isoformat() if ts else generated
                  quotes[sym] = {
                      "price": price,
                      "previousClose": prev,
                      "change": (price - prev) if prev is not None else None,
                      "changePct": ((price - prev) / prev * 100) if prev else None,
                      "timestamp": timestamp,
                      "marketState": meta.get("marketState", ""),
                      "source": "Yahoo Finance via GitHub Actions"
                  }
              except Exception as exc:
                  print(f"{sym}: quote unavailable: {exc}")
              time.sleep(0.15)

          out = {
              "generatedAt": generated,
              "source": "Yahoo Finance chart endpoint via GitHub Actions",
              "quoteCount": len(quotes),
              "quotes": quotes
          }
          path = Path("data/live_quotes.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, indent=2) + "\n")
          print(f"Published {len(quotes)}/{len(symbols)} quotes")
          PY

      - name: Commit updated quote feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live market quotes"
          git push
