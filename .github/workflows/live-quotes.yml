name: Update live market quotes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-quotes.yml'
      - 'data/rankings.json'
      - 'data/search_analysis.json'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: live-stock-feed-main
  cancel-in-progress: true

env:
  TARGET_BRANCH: main

jobs:
  update-market-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest stock quotes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-IN,en;q=0.9",
          }
          generated = datetime.now(timezone.utc).isoformat()

          def req_json(url, timeout=15):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          def extract_rows(x):
              if isinstance(x, list): return x
              if isinstance(x, dict):
                  for key in ("stocks", "analyses", "results", "rankings"):
                      if isinstance(x.get(key), list): return x[key]
                  if isinstance(x.get("data"), dict):
                      out=[]
                      for k,v in x["data"].items():
                          v=v or {}; v.setdefault("symbol", k); out.append(v)
                      return out
              return []

          symbols=[]
          seen=set()
          sources=[]
          for fn in ("data/search_analysis.json", "data/rankings.json", "data/nse_universe.json"):
              p=Path(fn)
              if not p.exists(): continue
              try: rows=extract_rows(json.loads(p.read_text(encoding="utf-8")))
              except Exception: rows=[]
              for s in rows:
                  sym=str(s.get("symbol") or "").strip().upper()
                  if sym and sym not in seen:
                      seen.add(sym); symbols.append(sym)
              sources.append((fn,len(rows)))

          print(f"Quote symbols: {len(symbols)} from {sources}")
          if not symbols: raise SystemExit("No stock symbols found")

          quotes={}; errors={}

          def yahoo_quote(sym):
              last="unknown Yahoo error"
              for host in ("query2.finance.yahoo.com","query1.finance.yahoo.com"):
                  try:
                      ticker=urllib.parse.quote(sym+".NS",safe="")
                      body=req_json(f"https://{host}/v8/finance/chart/{ticker}?range=1d&interval=1m&includePrePost=false")
                      result=(body.get("chart",{}).get("result") or [None])[0]
                      if not result: raise ValueError("empty chart result")
                      meta=result.get("meta",{}) or {}
                      price=meta.get("regularMarketPrice")
                      prev=meta.get("previousClose") or meta.get("chartPreviousClose")
                      if price is None:
                          closes=(((result.get("indicators") or {}).get("quote") or [{}])[0]).get("close") or []
                          vals=[float(x) for x in closes if x is not None]
                          price=vals[-1] if vals else None
                      if price is None: raise ValueError("price missing")
                      price=float(price); prev=float(prev) if prev is not None else None
                      ts=meta.get("regularMarketTime")
                      return {"price":price,"previousClose":prev,"change":(price-prev) if prev is not None else None,"changePct":((price-prev)/prev*100) if prev else None,"timestamp":datetime.fromtimestamp(ts,timezone.utc).isoformat() if ts else generated,"marketState":meta.get("marketState",""),"source":"Yahoo Finance chart endpoint"}
                  except Exception as exc:
                      last=f"{host}: {type(exc).__name__}: {exc}"
              raise RuntimeError(last)

          def nse_quote(sym):
              base="https://www.nseindia.com"
              opener=urllib.request.build_opener()
              home=urllib.request.Request(base+"/",headers={**headers,"Referer":base+"/"})
              with opener.open(home,timeout=15) as r: r.read(100)
              url=base+"/api/quote-equity?symbol="+urllib.parse.quote(sym)
              req=urllib.request.Request(url,headers={**headers,"Referer":base+"/get-quotes/equity?symbol="+urllib.parse.quote(sym)})
              with opener.open(req,timeout=15) as resp: body=json.loads(resp.read().decode("utf-8"))
              info=body.get("priceInfo") or {}; price=info.get("lastPrice")
              if price is None: raise ValueError("NSE lastPrice missing")
              price=float(price); prev=info.get("previousClose"); prev=float(prev) if prev is not None else None
              change=info.get("change"); change=float(change) if change is not None else ((price-prev) if prev is not None else None)
              pct=info.get("pChange"); pct=float(pct) if pct is not None else ((change/prev*100) if prev else None)
              return {"price":price,"previousClose":prev,"change":change,"changePct":pct,"timestamp":generated,"marketState":"NSE","source":"NSE India public quote endpoint"}

          for i,sym in enumerate(symbols):
              try:
                  quotes[sym]=yahoo_quote(sym)
              except Exception as yerr:
                  errors[sym]=[str(yerr)]
                  try: quotes[sym]=nse_quote(sym)
                  except Exception as nerr: errors[sym].append(str(nerr))
              if i % 25 == 0: print(f"Processed {i+1}/{len(symbols)}")
              time.sleep(0.08)

          if not quotes: raise SystemExit("No stock quotes were published")
          payload={"generatedAt":generated,"source":"Yahoo Finance with NSE India fallback","quoteCount":len(quotes),"requestedCount":len(symbols),"quotes":quotes,"errors":errors}
          Path("data/live_quotes.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(f"Published {len(quotes)}/{len(symbols)} quotes at {generated}")
          print(f"Unavailable: {len(errors)}")
          PY

      - name: Verify stock feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path("data/live_quotes.json").read_text(encoding="utf-8"))
          count=int(live.get("quoteCount",0)); requested=int(live.get("requestedCount",0))
          if count < 1: raise SystemExit("No stock quotes")
          if not live.get("generatedAt"): raise SystemExit("Missing feed timestamp")
          print(f"Stocks: {count}/{requested} | {live.get('generatedAt')}")
          PY

      - name: Commit updated stock feed to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update main live stock quotes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          exit 1
