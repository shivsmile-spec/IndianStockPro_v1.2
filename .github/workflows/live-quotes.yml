name: Update live market quotes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-quotes.yml'
      - 'data/rankings.json'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: true

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest NSE-linked quotes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          rankings = json.loads(Path("data/rankings.json").read_text())
          stocks = rankings.get("rankings") or rankings.get("stocks") or []
          if not stocks and isinstance(rankings.get("bands"), list):
              for band in rankings["bands"]:
                  stocks.extend(band.get("stocks") or [])

          symbols = []
          for s in stocks:
              sym = str(s.get("symbol") or "").strip().upper()
              if sym and sym not in symbols:
                  symbols.append(sym)

          generated = datetime.now(timezone.utc).isoformat()
          quotes, errors = {}, {}
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-IN,en;q=0.9",
          }

          def yahoo_quote(sym):
              last = "unknown Yahoo error"
              for host in ("query2.finance.yahoo.com", "query1.finance.yahoo.com"):
                  try:
                      ticker = urllib.parse.quote(sym + ".NS", safe="")
                      url = f"https://{host}/v8/finance/chart/{ticker}?range=1d&interval=1m&includePrePost=false"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          body = json.loads(resp.read().decode("utf-8"))
                      result = (body.get("chart", {}).get("result") or [None])[0]
                      if not result: raise ValueError("empty chart result")
                      meta = result.get("meta", {}) or {}
                      price = meta.get("regularMarketPrice")
                      prev = meta.get("previousClose") or meta.get("chartPreviousClose")
                      if price is None:
                          closes = (((result.get("indicators") or {}).get("quote") or [{}])[0]).get("close") or []
                          vals = [float(x) for x in closes if x is not None]
                          price = vals[-1] if vals else None
                      if price is None: raise ValueError("price missing")
                      price = float(price); prev = float(prev) if prev is not None else None
                      ts = meta.get("regularMarketTime")
                      return {"price":price,"previousClose":prev,"change":(price-prev) if prev is not None else None,"changePct":((price-prev)/prev*100) if prev else None,"timestamp":datetime.fromtimestamp(ts,timezone.utc).isoformat() if ts else generated,"marketState":meta.get("marketState",""),"source":"Yahoo Finance chart endpoint"}
                  except Exception as exc:
                      last = f"{host}: {type(exc).__name__}: {exc}"
              raise RuntimeError(last)

          def nse_quote(sym):
              base="https://www.nseindia.com"; opener=urllib.request.build_opener()
              home=urllib.request.Request(base+"/",headers={**headers,"Referer":base+"/"})
              with opener.open(home,timeout=15) as r: r.read(100)
              url=base+"/api/quote-equity?symbol="+urllib.parse.quote(sym)
              req=urllib.request.Request(url,headers={**headers,"Referer":base+"/get-quotes/equity?symbol="+urllib.parse.quote(sym)})
              with opener.open(req,timeout=15) as resp: body=json.loads(resp.read().decode("utf-8"))
              info=body.get("priceInfo") or {}; price=info.get("lastPrice")
              if price is None: raise ValueError("NSE lastPrice missing")
              price=float(price); prev=info.get("previousClose"); prev=float(prev) if prev is not None else None
              change=info.get("change"); change=float(change) if change is not None else ((price-prev) if prev is not None else None)
              pct=info.get("pChange"); pct=float(pct) if pct is not None else ((change/prev*100) if prev else None)
              return {"price":price,"previousClose":prev,"change":change,"changePct":pct,"timestamp":generated,"marketState":"NSE","source":"NSE India public quote endpoint"}

          for sym in symbols:
              try:
                  quotes[sym]=yahoo_quote(sym)
              except Exception as yerr:
                  errors[sym]=[str(yerr)]
                  try: quotes[sym]=nse_quote(sym)
                  except Exception as nerr:
                      errors[sym].append(str(nerr)); print(f"{sym}: unavailable | Yahoo={yerr} | NSE={nerr}")
              time.sleep(0.15)

          out={"generatedAt":generated,"source":"Yahoo Finance with NSE India fallback","quoteCount":len(quotes),"requestedCount":len(symbols),"quotes":quotes,"errors":errors}
          path=Path("data/live_quotes.json"); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(out,indent=2)+"\n")
          print(f"Published {len(quotes)}/{len(symbols)} quotes at {generated}")
          if errors: print(f"Unavailable symbols: {len(errors)}")
          PY

      - name: Verify quote feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path("data/live_quotes.json").read_text())
          count=int(body.get("quoteCount",0))
          requested=int(body.get("requestedCount",0))
          print(f"Quote feed: {count}/{requested}")
          if requested < 1 or count < 1:
              raise SystemExit("No live quotes were published")
          PY

      - name: Commit updated quote feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live market quotes"
          git push
