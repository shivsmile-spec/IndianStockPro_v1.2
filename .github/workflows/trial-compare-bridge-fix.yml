name: Trial compare bridge fix
on:
  push:
    branches:
      - trial-tab-ui
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial-tab-ui
          fetch-depth: 0
      - name: Patch compare event bridge
        shell: python
        run: |
          from pathlib import Path
          p=Path('compare-ui.js')
          s=p.read_text(encoding='utf-8')
          marker='  window.__ispTrialCompareOpen=open;'
          inject='''  window.__ispTrialCompareOpen=open;\n  /* Trial bridge: v2-features dispatches this event after creating the Compare button. */\n  window.addEventListener("isp:open-trial-compare",function(){open()});'''
          if marker in s and 'isp:open-trial-compare' not in s:
              s=s.replace(marker,inject,1)
              p.write_text(s,encoding='utf-8')
          else:
              print('Bridge already present or marker missing')
      - name: Patch index script cache version
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('compare-ui.js?v=20260821','compare-ui.js?v=20260821-bridge2')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compare-ui.js index.html
          git commit -m 'Trial: connect Compare button event bridge' || exit 0
          git rm .github/workflows/trial-compare-bridge-fix.yml
          git commit -m 'Trial: remove one-time compare bridge workflow'
          git push origin HEAD:trial-tab-ui