name: Update NIFTY and SENSEX indices

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/index-quotes.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: index-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresh exchange index data
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          NOW=datetime.now(timezone.utc)
          generated=NOW.isoformat()
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/plain,*/*","Accept-Language":"en-IN,en;q=0.9"}

          def req(url, extra=None):
              h=dict(headers)
              if extra: h.update(extra)
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=25) as r:
                  return json.loads(r.read().decode())

          out={"generatedAt":generated,"source":"NSE India marketStatus + BSE India public Sensex endpoint with Yahoo fallback","indices":{}}

          try:
              m=req("https://www.nseindia.com/api/marketStatus",{"Referer":"https://www.nseindia.com/"})
              row=next(x for x in m.get("marketState",[]) if x.get("index")=="NIFTY 50")
              value=float(row["last"]); change=float(row.get("variation") or 0); pct=float(row.get("percentChange") or 0)
              out["indices"]["NIFTY50"]={"value":value,"previousClose":value-change,"change":change,"changePct":pct,"timestamp":generated,"source":"NSE India marketStatus"}
          except Exception as e:
              try:
                  m=req("https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=1m"); meta=m["chart"]["result"][0]["meta"]; value=float(meta["regularMarketPrice"]); prev=float(meta.get("previousClose") or meta["chartPreviousClose"]); ts=datetime.fromtimestamp(meta["regularMarketTime"],timezone.utc).isoformat() if meta.get("regularMarketTime") else generated
                  out["indices"]["NIFTY50"]={"value":value,"previousClose":prev,"change":value-prev,"changePct":(value-prev)/prev*100,"timestamp":ts,"source":"Yahoo Finance fallback"}
              except Exception as y: print("NIFTY unavailable",e,y)

          try:
              m=req("https://api.bseindia.com/RealTimeBseIndiaAPI/api/GetSensexData/w",{"Referer":"https://www.bseindia.com/","Origin":"https://www.bseindia.com"}); row=m[0] if isinstance(m,list) and m else m; value=float(str(row.get("ltp") or row.get("CurrValue") or row.get("currvalue") or row.get("value")).replace(",","")); change=float(str(row.get("chg") or row.get("change") or row.get("variation") or 0).replace(",","")); pct=float(str(row.get("perchg") or row.get("changePercent") or row.get("percentChange") or 0).replace(",","")); out["indices"]["SENSEX"]={"value":value,"previousClose":value-change,"change":change,"changePct":pct,"timestamp":generated,"source":"BSE India public Sensex endpoint"}
          except Exception as e:
              try:
                  m=req("https://query1.finance.yahoo.com/v8/finance/chart/%5EBSESN?range=1d&interval=1m"); meta=m["chart"]["result"][0]["meta"]; value=float(meta["regularMarketPrice"]); prev=float(meta.get("previousClose") or meta["chartPreviousClose"]); ts=datetime.fromtimestamp(meta["regularMarketTime"],timezone.utc).isoformat() if meta.get("regularMarketTime") else generated
                  out["indices"]["SENSEX"]={"value":value,"previousClose":prev,"change":value-prev,"changePct":(value-prev)/prev*100,"timestamp":ts,"source":"Yahoo Finance fallback"}
              except Exception as y: print("SENSEX unavailable",e,y)

          if not out["indices"]: raise SystemExit("No index data received")
          Path("data/index_quotes.json").write_text(json.dumps(out,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2))
          PY

      - name: Publish index feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NIFTY and SENSEX index quotes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          exit 1
