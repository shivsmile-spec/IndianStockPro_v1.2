name: Update NIFTY and SENSEX indices

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/index-quotes.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: index-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index quotes
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}
          symbols={"NIFTY50":"^NSEI","SENSEX":"^BSESN"}
          out={"generatedAt":datetime.now(timezone.utc).isoformat(),"source":"Yahoo Finance public chart endpoint","indices":{}}
          for key,ticker in symbols.items():
            try:
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ticker,safe='')}?range=1d&interval=5m"
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r: body=json.loads(r.read().decode())
              res=body["chart"]["result"][0]; meta=res.get("meta",{}); p=meta.get("regularMarketPrice")
              prev=meta.get("previousClose") or meta.get("chartPreviousClose")
              if p is None: raise ValueError("price unavailable")
              out["indices"][key]={"value":float(p),"previousClose":float(prev) if prev is not None else None,"change":float(p)-float(prev) if prev is not None else None,"changePct":((float(p)-float(prev))/float(prev)*100) if prev else None,"timestamp":datetime.fromtimestamp(meta.get("regularMarketTime"),timezone.utc).isoformat() if meta.get("regularMarketTime") else out["generatedAt"]}
            except Exception as e:
              out["indices"][key]={"value":None,"error":str(e),"timestamp":out["generatedAt"]}
          Path("data/index_quotes.json").write_text(json.dumps(out,indent=2)+"\n")
          if not any(v.get("value") is not None for v in out["indices"].values()): raise SystemExit("No index quotes available")
          PY
      - name: Commit index feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NIFTY and SENSEX index quotes"
          git pull --rebase origin main
          git push
