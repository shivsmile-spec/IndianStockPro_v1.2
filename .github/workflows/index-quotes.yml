name: Update NIFTY and SENSEX indices

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/index-quotes.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: index-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresher exchange index data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          NOW=datetime.now(timezone.utc)
          out={
              "generatedAt":NOW.isoformat(),
              "source":"NSE India marketStatus + BSE India public Sensex endpoint with Yahoo fallback",
              "indices":{}
          }

          def req_json(url, headers=None, timeout=20):
              h={"User-Agent":"Mozilla/5.0","Accept":"application/json, text/plain, */*"}
              if headers: h.update(headers)
              request=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(request,timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          # NIFTY 50: use NSE's market-status endpoint first; fall back to Yahoo only if needed.
          try:
              market=req_json("https://www.nseindia.com/api/marketStatus",{
                  "Referer":"https://www.nseindia.com/",
                  "Accept-Language":"en-US,en;q=0.9",
              })
              row=next((x for x in market.get("marketState",[]) if x.get("index")=="NIFTY 50"),None)
              if not row or row.get("last") in (None,""):
                  raise ValueError("NIFTY value unavailable")
              value=float(row["last"])
              change=float(row["variation"]) if row.get("variation") not in (None,"") else None
              pct=float(row["percentChange"]) if row.get("percentChange") not in (None,"") else None
              prev=value-change if change is not None else None
              out["indices"]["NIFTY50"]={
                  "value":value,"previousClose":prev,"change":change,"changePct":pct,
                  "timestamp":NOW.isoformat(),"source":"NSE India marketStatus"
              }
          except Exception as nse_error:
              try:
                  body=req_json("https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=1m")
                  meta=body["chart"]["result"][0].get("meta",{})
                  value=float(meta["regularMarketPrice"]); prev=float(meta.get("previousClose") or meta.get("chartPreviousClose"))
                  ts=datetime.fromtimestamp(meta["regularMarketTime"],timezone.utc).isoformat() if meta.get("regularMarketTime") else NOW.isoformat()
                  out["indices"]["NIFTY50"]={"value":value,"previousClose":prev,"change":value-prev,"changePct":(value-prev)/prev*100,"timestamp":ts,"source":"Yahoo Finance fallback"}
              except Exception as yahoo_error:
                  out["indices"]["NIFTY50"]={"value":None,"previousClose":None,"change":None,"changePct":None,"timestamp":NOW.isoformat(),"source":"Unavailable","error":f"NSE: {nse_error}; Yahoo: {yahoo_error}"}

          # SENSEX: use BSE's public Sensex endpoint first; fall back to Yahoo.
          try:
              body=req_json("https://api.bseindia.com/RealTimeBseIndiaAPI/api/GetSensexData/w",{
                  "Referer":"https://www.bseindia.com/",
                  "Origin":"https://www.bseindia.com"
              })
              if isinstance(body,list):
                  row=body[0] if body else {}
              else:
                  row=body
              value=row.get("ltp") or row.get("CurrValue") or row.get("currvalue") or row.get("value")
              if isinstance(value,str): value=float(value.replace(",",""))
              else: value=float(value)
              change=row.get("chg") or row.get("change") or row.get("variation")
              pct=row.get("perchg") or row.get("changePercent") or row.get("percentChange")
              change=float(str(change).replace(",","")) if change not in (None,"") else None
              pct=float(str(pct).replace(",","")) if pct not in (None,"") else None
              prev=value-change if change is not None else None
              out["indices"]["SENSEX"]={
                  "value":value,"previousClose":prev,"change":change,"changePct":pct,
                  "timestamp":NOW.isoformat(),"source":"BSE India public Sensex endpoint"
              }
          except Exception as bse_error:
              try:
                  body=req_json("https://query1.finance.yahoo.com/v8/finance/chart/%5EBSESN?range=1d&interval=1m")
                  meta=body["chart"]["result"][0].get("meta",{})
                  value=float(meta["regularMarketPrice"]); prev=float(meta.get("previousClose") or meta.get("chartPreviousClose"))
                  ts=datetime.fromtimestamp(meta["regularMarketTime"],timezone.utc).isoformat() if meta.get("regularMarketTime") else NOW.isoformat()
                  out["indices"]["SENSEX"]={"value":value,"previousClose":prev,"change":value-prev,"changePct":(value-prev)/prev*100,"timestamp":ts,"source":"Yahoo Finance fallback"}
              except Exception as yahoo_error:
                  out["indices"]["SENSEX"]={"value":None,"previousClose":None,"change":None,"changePct":None,"timestamp":NOW.isoformat(),"source":"Unavailable","error":f"BSE: {bse_error}; Yahoo: {yahoo_error}"}

          Path("data/index_quotes.json").write_text(json.dumps(out,indent=2)+"\n",encoding="utf-8")
          good=[v for v in out["indices"].values() if v.get("value") is not None]
          if len(good)<1:
              raise SystemExit("No index quotes available")
          print(json.dumps(out,indent=2))
          PY

      - name: Commit fresh index feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NIFTY and SENSEX index quotes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Index feed published"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "Failed to publish index feed after 5 attempts"
          exit 1
