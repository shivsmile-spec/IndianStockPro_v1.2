name: Fix trial compare button

on:
  push:
    branches:
      - trial-tab-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial-tab-ui
          fetch-depth: 0

      - name: Patch compare button and data source
        shell: python
        run: |
          from pathlib import Path
          p=Path('compare-ui.js')
          s=p.read_text(encoding='utf-8')
          original=s

          marker='  var loaded=false, loading=null;'
          inject='''  var loaded=false, loading=null;

  /* Trial hardening: bind Compare at document level so dynamically-created toolbar buttons always work. */
  if(!window.__ispTrialCompareClickBound){
    document.addEventListener('click',function(e){
      var b=e.target.closest && e.target.closest('#ispCompareBtn');
      if(!b)return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if(typeof window.__ispTrialCompareOpen==='function') window.__ispTrialCompareOpen();
    },true);
    window.__ispTrialCompareClickBound=true;
  }'''
          if marker in s and '__ispTrialCompareClickBound' not in s:
              s=s.replace(marker,inject,1)

          marker2='      loaded=true;'
          inject2='''      /* The dashboard's already-loaded integrated dataset is the authoritative research map for Compare. */
      if(Array.isArray(window.integrated) && window.integrated.length){
        window.integrated.forEach(function(x){
          if(x&&x.symbol) researchBy[norm(x.symbol)]=x;
        });
      }
      loaded=true;'''
          if marker2 in s and 'authoritative research map for Compare' not in s:
              s=s.replace(marker2,inject2,1)

          marker3='  function install(){'
          if marker3 in s and 'window.__ispTrialCompareOpen=open;' not in s:
              s=s.replace(marker3,'  window.__ispTrialCompareOpen=open;\n\n'+marker3,1)

          if s != original:
              p.write_text(s,encoding='utf-8')
          else:
              print('No changes needed')

      - name: Commit trial fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compare-ui.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Trial: harden compare button and data source'
          git push origin HEAD:trial-tab-ui
