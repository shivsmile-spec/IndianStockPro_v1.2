name: Logical Context Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  context-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Logical Context Engine
        run: |
          python engine/context_engine.py

      - name: Commit context analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context_analysis.json
          git diff --cached --quiet || git commit -m "Update logical context analysis"
          git push
