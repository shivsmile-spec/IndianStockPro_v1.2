name: Fresh Institutional Research

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1-5"
    - cron: "15 5 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "15 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: institutional-research
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh public institutional research
        run: python engine/refresh_institutional.py
      - name: Verify feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/institutional_research.json').read_text())
          if not p.get('items'):
              raise SystemExit('Institutional research feed is empty')
          print('Institutional items:', len(p['items']))
          print('Generated:', p.get('generated'))
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/institutional_research.json
          git diff --cached --quiet && exit 0
          git commit -m "Update institutional research feed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 4
          done
          exit 1
