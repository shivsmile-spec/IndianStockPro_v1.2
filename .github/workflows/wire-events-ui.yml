name: Wire IPO and Dividend sections

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'events-ui.js'
      - 'data/ipo_calendar.json'
      - 'data/dividend_calendar.json'
      - '.github/workflows/wire-events-ui.yml'

permissions:
  contents: write

concurrency:
  group: wire-events-ui
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure events UI is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="events-ui.js"></script>'
          if tag not in text:
              marker='</body>'
              if marker not in text:
                  raise SystemExit('index.html has no </body> marker')
              text=text.replace(marker, tag+'\n'+marker, 1)
              p.write_text(text,encoding='utf-8')
              print('Injected events-ui.js')
          else:
              print('events-ui.js already wired')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add IPO and dividend calendar sections"
          git push origin HEAD:main
