name: News and Context Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'engine/news_engine.py'
      - 'data/rankings.json'
      - '.github/workflows/news_engine.yml'
  schedule:
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: news-context-analysis
  cancel-in-progress: true

jobs:
  news-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
      - name: Run News and Context Engine
        run: python engine/news_engine.py
      - name: Verify news feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/news_context.json').read_text())
          if not p.get('generated') or not p.get('marketContext',{}).get('articles'):
              raise SystemExit('News/context feed is empty or missing timestamp')
          print('News articles:', len(p['marketContext']['articles']))
          print('Generated:', p['generated'])
          PY
      - name: Publish news context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_context.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news and market context"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
