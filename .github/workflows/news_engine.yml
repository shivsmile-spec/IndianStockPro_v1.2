name: News and Context Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "45 13 * * 1-5"

permissions:
  contents: write

jobs:
  news-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run News and Context Engine
        run: |
          python engine/news_engine.py

      - name: Commit news analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_context.json
          git diff --cached --quiet || git commit -m "Update news and industry context analysis"
          git push
