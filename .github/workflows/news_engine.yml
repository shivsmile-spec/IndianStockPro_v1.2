name: News and Context Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 11 * * 1-5"
    - cron: "45 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: news-context-analysis
  cancel-in-progress: true

jobs:
  news-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run News and Context Engine
        run: |
          python engine/news_engine.py

      - name: Commit news analysis
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_context.json
          git diff --cached --quiet && echo "No news dataset changes" && exit 0
          git commit -m "Update news and industry context analysis"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add data/news_context.json; git commit -m "Update news and industry context analysis" || true; }
            if git push origin HEAD:main; then
              echo "News and context published"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish news context after 3 attempts"
          exit 1
