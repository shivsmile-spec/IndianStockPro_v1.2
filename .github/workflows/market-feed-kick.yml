name: Refresh market index feed

on:
  push:
    branches: [ main ]
    paths:
      - 'market-indices.js'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current NIFTY and SENSEX
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).isoformat()
          def get(url,headers=None):
              h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
              if headers: h.update(headers)
              r=urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30)
              return json.loads(r.read().decode())
          out={'generatedAt':now,'source':'NSE/BSE with Yahoo fallback','indices':{}}
          try:
              m=get('https://www.nseindia.com/api/marketStatus',{'Referer':'https://www.nseindia.com/','Accept-Language':'en-IN,en;q=0.9'})
              x=next(x for x in m.get('marketState',[]) if x.get('index')=='NIFTY 50')
              v=float(x['last']); c=float(x.get('variation') or 0); p=float(x.get('percentChange') or 0)
              out['indices']['NIFTY50']={'value':v,'previousClose':v-c,'change':c,'changePct':p,'timestamp':now,'source':'NSE India marketStatus'}
          except Exception:
              try:
                  m=get('https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=1m'); m=m['chart']['result'][0]['meta']; v=float(m['regularMarketPrice']); pc=float(m.get('previousClose') or m['chartPreviousClose']); out['indices']['NIFTY50']={'value':v,'previousClose':pc,'change':v-pc,'changePct':(v-pc)/pc*100,'timestamp':now,'source':'Yahoo Finance fallback'}
              except Exception: pass
          try:
              m=get('https://api.bseindia.com/RealTimeBseIndiaAPI/api/GetSensexData/w',{'Referer':'https://www.bseindia.com/','Origin':'https://www.bseindia.com'}); x=m[0] if isinstance(m,list) else m; v=float(str(x.get('ltp') or x.get('CurrValue') or x.get('value')).replace(',','')); c=float(str(x.get('chg') or x.get('change') or 0).replace(',','')); p=float(str(x.get('perchg') or x.get('changePercent') or 0).replace(',','')); out['indices']['SENSEX']={'value':v,'previousClose':v-c,'change':c,'changePct':p,'timestamp':now,'source':'BSE India public Sensex endpoint'}
          except Exception:
              try:
                  m=get('https://query1.finance.yahoo.com/v8/finance/chart/%5EBSESN?range=1d&interval=1m'); m=m['chart']['result'][0]['meta']; v=float(m['regularMarketPrice']); pc=float(m.get('previousClose') or m['chartPreviousClose']); out['indices']['SENSEX']={'value':v,'previousClose':pc,'change':v-pc,'changePct':(v-pc)/pc*100,'timestamp':now,'source':'Yahoo Finance fallback'}
              except Exception: pass
          if not out['indices']: raise SystemExit('No index data received')
          Path('data/index_quotes.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index_quotes.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh market index feed'
          git push
